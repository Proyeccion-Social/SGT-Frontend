name: SDD gate

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  workflow_run:
    workflows: [PR review signal]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

# Every run reads ALL current open PRs, so superseding a queued event cannot
# lose an update for another PR. Serialize writes to the shared commit status.
concurrency:
  group: sdd-feature-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only trusted default-branch code is executed with statuses:write.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const { run } = require('./scripts/ci/sdd-policy.cjs');
            await run({ github, context, core });
